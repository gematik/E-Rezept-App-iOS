disabled_rules:
  - attributes
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - identifier_name
  - line_length # automockable generates long property names
  - multiple_closures_with_trailing_closure
  - opening_brace # automockable generates long property names and breaks lines before "{
  - operator_usage_whitespace
  - trailing_closure
  - type_body_length
  - type_name
  - unneeded_synthesized_initializer
  - unneeded_override
opt_in_rules:
  - file_name
file_name: 
  excluded: ["SnapshotHelper.swift"]

custom_rules:
  must_not_contain_demodate:
    included: "Tests.*\\.swift"
    name: "Must not contain DemoDate"
    regex: ".*DemoDate.*"
    message: "File contains the string 'DemoDate'. Use 'TestDate' instead."
    severity: error


